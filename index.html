/* ============================================================
   DADOS: carregar tudo do Supabase
   ============================================================ */
async function loadAll(){
  if(!sb) return;
  state.loading = true; render();
  const [turmas, conferentes, auditorias, checklistItens, ncs, planos, bonificacoes] = await Promise.all([
    sb.from('turmas').select('*').then(r=>r.data||[]),
    sb.from('conferentes').select('*').eq('ativo', true).then(r=>r.data||[]),
    sb.from('auditorias').select('*').order('data', {ascending:true}).then(r=>r.data||[]),
    sb.from('checklist_itens').select('*').then(r=>r.data||[]),
    sb.from('nao_conformidades').select('*').order('created_at', {ascending:false}).then(r=>r.data||[]),
    sb.from('planos_acao').select('*').order('created_at', {ascending:false}).then(r=>r.data||[]),
    sb.from('bonificacoes').select('*').then(r=>r.data||[]),
  ]);
  Object.assign(state, { turmas, conferentes, auditorias, checklistItens, ncs, planos, bonificacoes });
  state.loading = false;
  render();
}

/* ============================================================
   AUTENTICAÇÃO
   ============================================================ */
async function doLogin(email, password){
  if(!sb){ alert('Configure o Supabase no topo do arquivo index.html antes de usar o sistema.'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alert('Login inválido: ' + error.message); return; }
  state.session = data.session;
  const { data: perfil } = await sb.from('perfis').select('*').eq('id', data.user.id).single();
  state.perfil = perfil;
  state.route = 'dashboard';
  await loadAll();
}
async function doLogout(){
  if(sb) await sb.auth.signOut();
  state.session = null; state.perfil = null; state.route = 'login';
  render();
}

/* ============================================================
   AÇÕES: nova auditoria
   ============================================================ */
async function submeterAuditoria(payload){
  if(!sb) return;
  const pesoTotal = CATEGORIAS.reduce((s,c)=>s+c.peso,0);
  let notaPonderada = 0;
  CATEGORIAS.forEach(cat=>{
    const itens = payload.itens.filter(i=>i.categoria===cat.nome);
    if(!itens.length) return;
    const conformes = itens.filter(i=>i.conforme).length;
    const pctCat = conformes/itens.length;
    notaPonderada += pctCat * cat.peso;
  });
  const notaGeral = Math.round((notaPonderada/pesoTotal)*100);

  const { data: auditoria, error } = await sb.from('auditorias').insert({
    data: payload.data, turno: payload.turno, area: payload.area,
    conferente_id: payload.conferenteId, auditor_id: state.perfil.id,
    nota_geral: notaGeral, status: 'CONCLUIDA'
  }).select().single();
  if(error){ alert('Erro ao salvar auditoria: '+error.message); return; }

  const itensRows = payload.itens.map(i => ({
    auditoria_id: auditoria.id, categoria: i.categoria, peso: CATEGORIAS.find(c=>c.nome===i.categoria).peso,
    descricao: i.descricao, conforme: i.conforme, criticidade: i.conforme ? null : i.criticidade
  }));
  await sb.from('checklist_itens').insert(itensRows);

  const naoConformes = payload.itens.filter(i=>!i.conforme);
  for(const nc of naoConformes){
    const codigo = 'AP-' + Date.now() + '-' + Math.floor(Math.random()*900+100);
    await sb.from('nao_conformidades').insert({
      codigo, auditoria_id: auditoria.id, criticidade: nc.criticidade || 'MEDIA',
      local: payload.area, categoria: nc.categoria, descricao: nc.descricao, status: 'PENDENTE'
    });
  }

  const valorBase = 150;
  const valorFinal = Math.max(0, Math.round(valorBase * (notaGeral/100)));
  await sb.from('bonificacoes').insert({ conferente_id: payload.conferenteId, auditoria_id: auditoria.id, valor: valorFinal, data: payload.data });

  alert(`Auditoria salva! Nota geral: ${notaGeral}%  •  Bonificação: ${fmtMoney(valorFinal)}`);
  state.route = 'dashboard';
  await loadAll();
}

async function atualizarStatusNC(ncId, status){
  await sb.from('nao_conformidades').update({status}).eq('id', ncId);
  await loadAll();
}
async function criarPlano(ncId, payload){
  await sb.from('planos_acao').insert({ nc_id: ncId, ...payload });
  await sb.from('nao_conformidades').update({status:'EM_ANDAMENTO'}).eq('id', ncId);
  await loadAll();
}
async function atualizarStatusPlano(planoId, status){
  await sb.from('planos_acao').update({status}).eq('id', planoId);
  if(status === 'CONCLUIDO'){
    const plano = state.planos.find(p=>p.id===planoId);
    if(plano) await sb.from('nao_conformidades').update({status:'CONCLUIDO'}).eq('id', plano.nc_id);
  }
  await loadAll();
}

function filteredAuditorias(){
  return state.auditorias.filter(a => {
    if(state.filters.de && a.data < state.filters.de) return false;
    if(state.filters.ate && a.data > state.filters.ate) return false;
    if(state.filters.turno !== 'Todos' && a.turno !== state.filters.turno) return false;
    if(state.filters.conferenteId !== 'Todos' && a.conferente_id !== state.filters.conferenteId) return false;
    if(state.filters.area !== 'Todas' && a.area !== state.filters.area) return false;
    return true;
  });
}

function DashboardScreen(){
  const auditorias = filteredAuditorias();
  const notaMedia = auditorias.length ? Math.round(auditorias.reduce((s,a)=>s+(a.nota_geral||0),0)/auditorias.length) : 0;
  const meta = 85;
  const statusGeral = notaMedia >= meta ? { label:'OK', cls:'bg-emerald-500 text-white' } : notaMedia >= meta-15 ? { label:'ATENÇÃO', cls:'bg-amber-500 text-slate-950' } : { label:'CRÍTICO', cls:'bg-rose-500 text-white' };

  const auditoriaIds = new Set(auditorias.map(a=>a.id));
  const bonifFiltradas = state.bonificacoes.filter(b => auditoriaIds.has(b.auditoria_id));
  const totalBonif = bonifFiltradas.reduce((s,b)=>s+Number(b.valor||0),0);

  const ncsFiltradas = state.ncs.filter(nc => auditoriaIds.has(nc.auditoria_id));
  const ncsPendentes = ncsFiltradas.filter(nc=>nc.status==='PENDENTE').length;
  const ncsAndamento = ncsFiltradas.filter(nc=>nc.status==='EM_ANDAMENTO').length;
  const ncsConcluidas = ncsFiltradas.filter(nc=>nc.status==='CONCLUIDO').length;

  // dias sem NC crítica
  const criticas = ncsFiltradas.filter(nc=>nc.criticidade==='ALTA').sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  const diasSemPerda = criticas.length ? Math.floor((Date.now() - new Date(criticas[0].created_at)) / 86400000) : (auditorias.length ? Math.floor((Date.now() - new Date(auditorias[0].created_at||auditorias[0].data)) / 86400000) : 0);

  // ranking conferentes
  const porConferente = {};
  auditorias.forEach(a=>{
    const c = state.conferentes.find(c=>c.id===a.conferente_id);
    if(!c) return;
    porConferente[c.id] = porConferente[c.id] || { nome:c.nome, notas:[], bonif:0, n:0 };
    porConferente[c.id].notas.push(a.nota_geral||0);
    porConferente[c.id].n++;
  });
  bonifFiltradas.forEach(b=>{ if(porConferente[b.conferente_id]) porConferente[b.conferente_id].bonif += Number(b.valor||0); });
  const rankingConferentes = Object.values(porConferente)
    .map(c=>({...c, media: Math.round(c.notas.reduce((s,n)=>s+n,0)/c.notas.length)}))
    .sort((a,b)=>b.media-a.media);

  // ranking locais
  const porLocal = {};
  ncsFiltradas.forEach(nc=>{ porLocal[nc.local] = (porLocal[nc.local]||0)+1; });
  const rankingLocais = Object.entries(porLocal).sort((a,b)=>b[1]-a[1]);

  // ranking turmas
  const porTurma = {};
  state.turmas.forEach(t => porTurma[t.id] = { nome:t.nome, bonif:0, n:0, ncs:0, notas:[] });
  auditorias.forEach(a=>{
    const c = state.conferentes.find(c=>c.id===a.conferente_id);
    if(!c || !c.turma_id || !porTurma[c.turma_id]) return;
    porTurma[c.turma_id].n++;
    porTurma[c.turma_id].notas.push(a.nota_geral||0);
  });
  bonifFiltradas.forEach(b=>{
    const c = state.conferentes.find(c=>c.id===b.conferente_id);
    if(c && c.turma_id && porTurma[c.turma_id]) porTurma[c.turma_id].bonif += Number(b.valor||0);
  });
  ncsFiltradas.forEach(nc=>{
    const a = state.auditorias.find(a=>a.id===nc.auditoria_id);
    const c = a && state.conferentes.find(c=>c.id===a.conferente_id);
    if(c && c.turma_id && porTurma[c.turma_id]) porTurma[c.turma_id].ncs++;
  });
  const rankingTurmas = Object.values(porTurma).map(t=>({...t, media: t.notas.length ? Math.round(t.notas.reduce((s,n)=>s+n,0)/t.notas.length) : null})).sort((a,b)=>(b.media||-1)-(a.media||-1));

  return `
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5 fade-in">
    ${FilterPanel()}

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${Card(`
        <div class="flex items-center justify-between mb-1"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pontuação Geral (Média)</span><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${statusGeral.cls}">${statusGeral.label}</span></div>
        <div class="text-4xl font-display font-black text-white mt-2">${fmtPct(notaMedia)} <span class="text-sm font-medium text-slate-400">meta ${meta}%</span></div>
        <div class="w-full h-2 bg-slate-800 rounded-full mt-3 overflow-hidden"><div class="h-full bg-gradient-to-r from-indigo-500 to-cyan-400 rounded-full" style="width:${Math.min(100,notaMedia)}%"></div></div>
      `, 'col-span-2')}
      ${Card(`<div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Bonificação Gerada</div><div class="text-3xl font-display font-black text-indigo-400 mt-2">${fmtMoney(totalBonif)}</div><div class="text-xs text-slate-500 mt-1">Ref. a ${auditorias.length} auditoria(s)</div>`)}
      ${Card(`<div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Não Conformidades</div><div class="text-3xl font-display font-black text-amber-400 mt-2">${ncsFiltradas.length}</div><div class="text-xs text-slate-500 mt-1">${ncsPendentes} pendente(s)</div>`)}
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      ${Card(`<div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total de Ações</div><div class="text-2xl font-display font-black text-white mt-2">${state.planos.length} Planos</div>`)}
      ${Card(`<div class="text-xs font-bold text-rose-400 uppercase tracking-wider">Pendentes</div><div class="text-2xl font-display font-black text-rose-400 mt-2">${ncsPendentes} Ações</div>`, 'bg-rose-950/20 border-rose-900/30')}
      ${Card(`<div class="text-xs font-bold text-amber-400 uppercase tracking-wider">Em Andamento</div><div class="text-2xl font-display font-black text-amber-400 mt-2">${ncsAndamento} Ações</div>`, 'bg-amber-950/20 border-amber-900/30')}
    </div>

    ${Card(`
      <div class="flex items-center justify-between mb-1">
        <div><h3 class="font-display font-bold text-white text-lg">Tendência de Conformidade Operacional</h3><p class="text-sm text-slate-400 mt-0.5">Evolução diária das notas médias dos turnos auditados</p></div>
      </div>
      <div class="h-64 mt-4"><canvas id="chartTendencia"></canvas></div>
    `)}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${Card(`
        <h3 class="font-display font-bold text-white text-lg">Índice de Conformidade por Categoria</h3>
        <p class="text-sm text-slate-400 mt-0.5">Nota média atingida x peso na remuneração</p>
        <div class="h-64 mt-4"><canvas id="chartCategoria"></canvas></div>
      `)}
      ${Card(`
        <h3 class="font-display font-bold text-white text-lg">Auditorias por Turno</h3>
        <p class="text-sm text-slate-400 mt-0.5">Distribuição proporcional das auditorias realizadas</p>
        <div class="h-64 mt-4"><canvas id="chartTurno"></canvas></div>
      `)}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${Card(`
        <h3 class="font-display font-bold text-white text-lg">Ranking de Conferentes (BR3R)</h3>
        <p class="text-sm text-slate-400 mt-0.5">Desempenho médio e bonificações estimadas</p>
        <div class="space-y-3 mt-4">
          ${rankingConferentes.length ? rankingConferentes.map((c,i)=>`
            <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-850 border border-slate-800">
              <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-full ${i===0?'bg-amber-500 text-slate-950':'bg-slate-700 text-slate-200'} flex items-center justify-center font-bold text-sm">${i+1}</div>
                <div><div class="font-semibold text-white text-sm">${c.nome}</div><div class="text-xs text-slate-500">${c.n} auditoria(s)</div></div>
              </div>
              <div class="text-right"><div class="font-display font-bold text-amber-400">${fmtPct(c.media)}</div><div class="text-xs text-indigo-400">${fmtMoney(c.bonif)}</div></div>

      `)}
      ${Card(`
        <h3 class="font-display font-bold text-white text-lg">Ranking de Locais da Ocorrência</h3>
        <p class="text-sm text-slate-400 mt-0.5">Locais com maior índice de não conformidades registradas</p>

          ${rankingLocais.length ? rankingLocais.map(([local,n],i)=>`
            <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-850 border border-slate-800">

    ${Card(`

      <p class="text-sm text-slate-400 mt-0.5">Desempenho consolidado, notas médias e valor total de bonificação/desconto por turma</p>
      <div class="space-y-3 mt-4">
        ${rankingTurmas.map((t,i)=>`
          <div class="p-4 rounded-xl border ${i===0 && t.media!==null ? 'border-indigo-500/50 bg-indigo-500/5' : 'border-slate-800 bg-slate-850'}">
            <div class="flex items-center justify-between mb-2">

              ${t.media!==null ? `<span class="px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-400 text-xs font-bold">${fmtPct(t.media)}</span>` : `<span class="text-xs text-slate-500">Sem dados</span>`}

    `)}
  </div>`;

function renderDashboardCharts(){
  if(!window.Chart) return;
  ['chartTendencia','chartCategoria','chartTurno'].forEach(id=>{
    const c = Chart.getChart(id); if(c) c.destroy();
  });
  const auditorias = filteredAuditorias().slice().sort((a,b)=> a.data.localeCompare(b.data));

  // Tendência
  const porDia = {};
  auditorias.forEach(a=>{ porDia[a.data] = porDia[a.data] || []; porDia[a.data].push(a.nota_geral||0); });
  const dias = Object.keys(porDia).sort();
  const mediasDia = dias.map(d => Math.round(porDia[d].reduce((s,n)=>s+n,0)/porDia[d].length));
  const elT = document.getElementById('chartTendencia');
  if(elT){
    new Chart(elT, { type:'line', data:{ labels: dias.map(fmtDate), datasets:[
      { label:'Meta (85%)', data: dias.map(()=>85), borderColor:'#f43f5e', borderDash:[6,6], pointRadius:0, tension:0 },
      { label:'Nota Geral', data: mediasDia, borderColor:'#6366f1', backgroundColor:'#6366f133', fill:true, tension:.35, pointBackgroundColor:'#6366f1' },
    ]}, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{min:50,max:100, grid:{color:'#1e293b'}, ticks:{color:'#94a3b8'}}, x:{grid:{display:false}, ticks:{color:'#94a3b8'}} }, plugins:{legend:{labels:{color:'#cbd5e1'}}} } });
  }

  // Categoria
  const elC = document.getElementById('chartCategoria');
  if(elC){
    const itensFiltrados = state.checklistItens.filter(i => auditorias.some(a=>a.id===i.auditoria_id));
    const pctPorCat = CATEGORIAS.map(cat=>{
      const itens = itensFiltrados.filter(i=>i.categoria===cat.nome);
      if(!itens.length) return 0;
      return Math.round(itens.filter(i=>i.conforme).length/itens.length*100);
    });
    new Chart(elC, { type:'bar', data:{ labels: CATEGORIAS.map(c=>`${c.nome} (${c.peso}%)`), datasets:[{ data: pctPorCat, backgroundColor:['#818cf8','#38bdf8','#2dd4bf','#fbbf24','#f472b6'], borderRadius:8 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{min:0,max:100,grid:{color:'#1e293b'},ticks:{color:'#94a3b8'}}, x:{grid:{display:false},ticks:{color:'#94a3b8', font:{size:10}}} } } });
  }

  // Turno donut
  const elTu = document.getElementById('chartTurno');
  if(elTu){
    const porTurno = {};
    auditorias.forEach(a=>{ porTurno[a.turno] = (porTurno[a.turno]||0)+1; });
    new Chart(elTu, { type:'doughnut', data:{ labels:Object.keys(porTurno), datasets:[{ data:Object.values(porTurno), backgroundColor:['#818cf8','#38bdf8','#2dd4bf','#fbbf24'], borderWidth:0 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:'#cbd5e1'}}} } });
  }
}

            ${!it.conforme ? `
              <div class="mt-2.5 pt-2.5 border-t border-slate-800">
                <label class="text-xs text-slate-400 block mb-1">Criticidade do desvio</label>
                <select onchange="setItemCriticidade(${it.idx}, this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                  ${['BAIXA','MEDIA','ALTA'].map(c=>`<option ${it.criticidade===c?'selected':''}>${c}</option>`).join('')}
                </select>
              </div>` : ''}
          </div>`).join('')}
      </div>
    `)).join('')}

    <button onclick="finalizarAuditoria()" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition-all shadow-lg shadow-indigo-600/25">Finalizar e Salvar Auditoria</button>
  </div>`;
}
function updateNovaAuditoria(key, val){ state._novaAuditoria[key] = val; render(); }
function setItemConforme(idx, val){ state._novaAuditoria.itens[idx].conforme = val; render(); }
function setItemCriticidade(idx, val){ state._novaAuditoria.itens[idx].criticidade = val; render(); }
async function finalizarAuditoria(){
  const f = state._novaAuditoria;
  if(!f.conferenteId){ alert('Cadastre um conferente em Configurações antes de lançar uma auditoria.'); return; }
  await submeterAuditoria(f);
  state._novaAuditoria = null;
}

/* ============================================================
   TELA: NÃO CONFORMIDADES (dentro de Planos de Ação)
   ============================================================ */
function PlanosAcaoScreen(){
  state._ncFilter = state._ncFilter || { busca:'', status:'Todos', criticidade:'Todas' };
  const f = state._ncFilter;
  const ncsFiltradas = state.ncs.filter(nc => {
    if(f.busca && !(`${nc.descricao} ${nc.codigo} ${nc.local}`.toLowerCase().includes(f.busca.toLowerCase()))) return false;
    if(f.status !== 'Todos' && nc.status !== f.status) return false;
    if(f.criticidade !== 'Todas' && nc.criticidade !== f.criticidade) return false;
    return true;
  });

  return `
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 space-y-5 fade-in">
    <h2 class="font-display font-extrabold text-2xl text-white">Não Conformidades &amp; Planos de Ação</h2>

    ${Card(`
      <input type="text" placeholder="Pesquisar por descrição, local, código..." value="${f.busca}" oninput="setNcFilter('busca', this.value)" class="w-full bg-slate-850 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 mb-3">
      <div class="grid grid-cols-2 gap-3">
        <select onchange="setNcFilter('status', this.value)" class="bg-slate-850 border border-slate-800 rounded-lg px-3 py-2.5 text-sm text-white">
          <option ${f.status==='Todos'?'selected':''}>Todos</option>
          ${['PENDENTE','EM_ANDAMENTO','CONCLUIDO'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
        </select>
        <select onchange="setNcFilter('criticidade', this.value)" class="bg-slate-850 border border-slate-800 rounded-lg px-3 py-2.5 text-sm text-white">
          <option ${f.criticidade==='Todas'?'selected':''}>Todas as Criticidades</option>
          ${['BAIXA','MEDIA','ALTA'].map(c=>`<option ${f.criticidade===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    `, 'sticky top-[70px] z-30 shadow-lg shadow-black/30')}

    ${ncsFiltradas.length===0 ? Card(`<p class="text-center text-slate-500 py-8">Nenhuma não conformidade encontrada.</p>`) : ncsFiltradas.map(nc => {
      const plano = state.planos.find(p=>p.nc_id===nc.id);
      return Card(`
        <div class="flex items-start justify-between gap-3 mb-3">
          <span class="text-xs text-slate-500 font-mono">${nc.codigo}</span>
          ${statusBadge(nc.status)}
        </div>
        <div class="flex flex-wrap gap-2 mb-3">
          ${criticidadeBadge(nc.criticidade)}
          <span class="px-2.5 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-bold">LOCAL: ${nc.local.toUpperCase()}</span>
        </div>
        <div class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Categoria: ${nc.categoria}</div>
        <p class="text-white font-semibold mb-4">${nc.descricao}</p>

        ${plano ? `
          <div class="border-t border-slate-800 pt-3 space-y-1.5">
            <div class="text-xs font-bold text-slate-400 uppercase">Plano de Ação</div>
            <div class="text-sm text-slate-300">Responsável: <span class="text-white">${plano.responsavel||'-'}</span></div>
            <div class="text-sm text-slate-300">Prazo: <span class="text-white">${plano.prazo ? fmtDate(plano.prazo) : '-'}</span></div>
            ${plano.descricao_acao ? `<div class="text-sm text-slate-300">Ação: <span class="text-white">${plano.descricao_acao}</span></div>` : ''}
            <div class="flex gap-2 mt-3">
              ${plano.status !== 'CONCLUIDO' ? `<button onclick="atualizarStatusPlano('${plano.id}','EM_ANDAMENTO')" class="px-3 py-1.5 rounded-lg bg-amber-500/15 text-amber-400 text-xs font-bold">Em Andamento</button>
              <button onclick="atualizarStatusPlano('${plano.id}','CONCLUIDO')" class="px-3 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-400 text-xs font-bold">Concluir</button>` : `<span class="text-xs text-emerald-400 font-bold">✓ Plano concluído</span>`}
            </div>
          </div>
        ` : `
          <button onclick="abrirFormPlano('${nc.id}')" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold transition-all">+ Criar Plano de Ação</button>
          ${state._planoFormFor === nc.id ? PlanoForm(nc.id) : ''}
        `}
      `);
    }).join('')}
  </div>`;
}
function setNcFilter(key,val){ state._ncFilter[key]=val; render(); }
function abrirFormPlano(ncId){ state._planoFormFor = ncId; render(); }
function PlanoForm(ncId){
  return `
  <div class="mt-3 pt-3 border-t border-slate-800 space-y-2.5">
    <input id="planoResp" type="text" placeholder="Responsável" class="w-full bg-slate-850 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500">
    <input id="planoPrazo" type="date" class="w-full bg-slate-850 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
    <textarea id="planoDescricao" placeholder="Descrição da ação corretiva" rows="2" class="w-full bg-slate-850 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500"></textarea>
    <button onclick="salvarPlano('${ncId}')" class="w-full py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold">Salvar Plano</button>
  </div>`;
}
async function salvarPlano(ncId){
  const responsavel = $('#planoResp').value;
  const prazo = $('#planoPrazo').value || null;
  const descricao_acao = $('#planoDescricao').value;
  await criarPlano(ncId, { responsavel, prazo, descricao_acao });
  state._planoFormFor = null;
}

/* ============================================================
   TELA: HISTÓRICO
   ============================================================ */
function HistoricoScreen(){
  const rows = state.auditorias.slice().sort((a,b)=>b.data.localeCompare(a.data));
  return `
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 space-y-5 fade-in">
    <h2 class="font-display font-extrabold text-2xl text-white">Histórico de Auditorias</h2>
    ${Card(`
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-slate-500 text-xs uppercase border-b border-slate-800">
            <th class="pb-2 pr-4">Data</th><th class="pb-2 pr-4">Turno</th><th class="pb-2 pr-4">Área</th><th class="pb-2 pr-4">Conferente</th><th class="pb-2">Nota</th>
          </tr></thead>
          <tbody class="divide-y divide-slate-800">
            ${rows.length ? rows.map(a=>{
              const c = state.conferentes.find(c=>c.id===a.conferente_id);
              return `<tr><td class="py-2.5 pr-4 text-slate-300">${fmtDate(a.data)}</td><td class="py-2.5 pr-4 text-slate-300">${a.turno}</td><td class="py-2.5 pr-4 text-slate-300">${a.area}</td><td class="py-2.5 pr-4 text-white font-medium">${c?.nome||'-'}</td><td class="py-2.5 font-bold ${a.nota_geral>=85?'text-emerald-400':a.nota_geral>=70?'text-amber-400':'text-rose-400'}">${fmtPct(a.nota_geral||0)}</td></tr>`;
            }).join('') : `<tr><td colspan="5" class="py-8 text-center text-slate-500">Nenhuma auditoria registrada ainda.</td></tr>`}
          </tbody>
        </table>
      </div>
    `)}
  </div>`;
}

/* ============================================================
   TELA: CONFIGURAÇÕES
   ============================================================ */
function ConfiguracoesScreen(){
  return `
  <div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 space-y-5 fade-in">
    <h2 class="font-display font-extrabold text-2xl text-white">Configurações</h2>

    ${Card(`
      <h3 class="font-display font-bold text-white mb-3">Adicionar Conferente</h3>
      <div class="space-y-2.5">
        <input id="confNome" type="text" placeholder="Nome do conferente" class="w-full bg-slate-850 border border-slate-800 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-500">
        <select id="confTurma" class="w-full bg-slate-850 border border-slate-800 rounded-lg px-3 py-2.5 text-sm text-white">
          ${state.turmas.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('')}
        </select>
        <button onclick="adicionarConferente()" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold">Adicionar</button>
      </div>
    `)}

    ${Card(`
      <h3 class="font-display font-bold text-white mb-3">Conferentes Ativos</h3>
      <div class="space-y-2">
        ${state.conferentes.map(c=>{
          const t = state.turmas.find(t=>t.id===c.turma_id);
          return `<div class="flex items-center justify-between p-3 rounded-lg bg-slate-850 border border-slate-800">
            <span class="text-sm text-white">${c.nome}</span>
            <span class="text-xs text-slate-400">${t?.nome||'-'}</span>
          </div>`;
        }).join('') || `<p class="text-sm text-slate-500">Nenhum conferente cadastrado.</p>`}
      </div>
    `)}
  </div>`;
}
async function adicionarConferente(){
  const nome = $('#confNome').value.trim();
  const turma_id = $('#confTurma').value;
  if(!nome) return;
  await sb.from('conferentes').insert({ nome, turma_id, ativo: true });
  await loadAll();
}

/* ============================================================
   ROTEAMENTO / RENDER
   ============================================================ */
function toggleMenu(){ state._menuOpen = !state._menuOpen; render(); }
function navigate(route){ state.route = route; state._menuOpen = false; render(); }

function render(){
  const root = $('#root');
  if(!state.session){
    root.innerHTML = LoginScreen();
    $('#loginForm').addEventListener('submit', (e)=>{ e.preventDefault(); doLogin($('#loginEmail').value, $('#loginPassword').value); });
    return;
  }
  let body = '';
  if(state.loading){
    body = `<div class="flex items-center justify-center py-24"><div class="h-8 w-8 border-2 border-t-indigo-500 border-slate-700 rounded-full animate-spin"></div></div>`;
  } else {
    body = {
      'dashboard': DashboardScreen,
      'nova-auditoria': NovaAuditoriaScreen,
      'planos-acao': PlanosAcaoScreen,
      'historico': HistoricoScreen,
      'configuracoes': ConfiguracoesScreen,
    }[state.route]?.() || DashboardScreen();
  }
  root.innerHTML = Header() + body;
  if(state.route === 'dashboard' && !state.loading) setTimeout(renderDashboardCharts, 0);
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
async function init(){
  if(sb){
    const { data } = await sb.auth.getSession();
    if(data.session){
      state.session = data.session;
      const { data: perfil } = await sb.from('perfis').select('*').eq('id', data.session.user.id).single();
      state.perfil = perfil;
      state.route = 'dashboard';
      await loadAll();
      return;
    }
  }
  render();
}
init();
</script>
</body>
</html>
