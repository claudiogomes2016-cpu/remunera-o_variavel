/* ============================================================
   DADOS: carregar tudo do Supabase
   ============================================================ */
async function loadAll(){
  if(!sb) return;
  state.loading = true; render();
  const [turmas, conferentes, auditorias, checklistItens, ncs, planos, bonificacoes, configRows] = await Promise.all([
    sb.from('turmas').select('*').then(r=>r.data||[]),
    sb.from('conferentes').select('*').eq('ativo', true).then(r=>r.data||[]),
    sb.from('auditorias').select('*').order('data', {ascending:true}).then(r=>r.data||[]),
    sb.from('checklist_itens').select('*').then(r=>r.data||[]),
    sb.from('nao_conformidades').select('*').order('created_at', {ascending:false}).then(r=>r.data||[]),
    sb.from('planos_acao').select('*').order('created_at', {ascending:false}).then(r=>r.data||[]),
    sb.from('bonificacoes').select('*').then(r=>r.data||[]),
    sb.from('configuracoes').select('*').eq('id',1).maybeSingle().then(r=>r.data||null),
  ]);
  Object.assign(state, { turmas, conferentes, auditorias, checklistItens, ncs, planos, bonificacoes, configuracoes: configRows });
  state.loading = false;
  render();
}

/* ============================================================
   AUTENTICAÇÃO

async function doLogin(email, password){
  if(!sb){ alert('Configure o Supabase no topo do arquivo index.html antes de usar o sistema.'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alert('Login inválido: ' + error.message); return; }
  state.session = data.session;
  const { data: perfil } = await sb.from('perfis').select('*').eq('id', data.user.id).single();
  state.perfil = perfil;
  state.route = 'dashboard';
  await loadAll();
}
async function doLogout(){
  if(sb) await sb.auth.signOut();
  state.session = null; state.perfil = null; state.route = 'login';
  render();
}

/* ============================================================
   AÇÕES: nova auditoria
   ============================================================ */
async function submeterAuditoria(payload){
  if(!sb) return;
  const pesoTotal = CATEGORIAS.reduce((s,c)=>s+c.peso,0);
  let notaPonderada = 0;
  CATEGORIAS.forEach(cat=>{
    const itens = payload.itens.filter(i=>i.categoria===cat.nome);
    if(!itens.length) return;
    const conformes = itens.filter(i=>i.conforme).length;
    const pctCat = conformes/itens.length;
    notaPonderada += pctCat * cat.peso;
  });
  const notaGeral = Math.round((notaPonderada/pesoTotal)*100);

  // Regra crítica: item de "regra de ouro" não conforme (ex: trava-rodas) desclassifica o turno
  const violouRegraCritica = payload.itens.some(i => i.regraCritica && !i.conforme);
  const desclassificado = violouRegraCritica || (payload.regrasEliminatorias && payload.regrasEliminatorias.length > 0);
  const status = desclassificado ? 'DESCLASSIFICADO' : 'CONCLUIDA';

  const { data: auditoria, error } = await sb.from('auditorias').insert({
    data: payload.data, turno: payload.turno, horario_turno: payload.horarioTurno, lider_sodexo: payload.liderSodexo, tipo: payload.tipo, area: payload.area,
    conferente_id: payload.conferenteId, auditor_id: state.perfil.id,
    nota_geral: notaGeral, status
  }).select().single();
  if(error){ alert('Erro ao salvar auditoria: '+error.message); return; }

  const itensRows = payload.itens.map(i => ({
    auditoria_id: auditoria.id, categoria: i.categoria, peso: CATEGORIAS.find(c=>c.nome===i.categoria).peso,
    descricao: i.descricao, conforme: i.conforme, criticidade: i.conforme ? null : i.criticidade
  }));
  await sb.from('checklist_itens').insert(itensRows);

  const naoConformes = payload.itens.filter(i=>!i.conforme);
  for(const nc of naoConformes){
    const codigo = 'AP-' + Date.now() + '-' + Math.floor(Math.random()*900+100);
    const prazo = new Date(new Date(payload.data+'T00:00:00').getTime() + 3*86400000).toISOString().slice(0,10);
    await sb.from('nao_conformidades').insert({
      codigo, auditoria_id: auditoria.id, criticidade: nc.regraCritica ? 'ALTA' : (nc.criticidade || 'MEDIA'),
      local: payload.area, categoria: nc.categoria, descricao: nc.descricao, status: 'PENDENTE',
      fotos: nc.fotos || []
    });
    // Plano de ação automático (responsável = Líder Sodexo do turno, prazo = data + 3 dias)
    const { data: ncRow } = await sb.from('nao_conformidades').select('id').eq('codigo', codigo).single();
    if(ncRow) await sb.from('planos_acao').insert({ nc_id: ncRow.id, responsavel: payload.liderSodexo || 'A definir', prazo, status:'PENDENTE' });
  }
  if(payload.regrasEliminatorias && payload.regrasEliminatorias.length > 0){
    for(const codigoRegra of payload.regrasEliminatorias){
      const regra = REGRAS_ELIMINATORIAS.find(r=>r.codigo===codigoRegra);
      const codigo = 'AP-' + Date.now() + '-' + Math.floor(Math.random()*900+100);
      await sb.from('nao_conformidades').insert({
        codigo, auditoria_id: auditoria.id, criticidade: 'ALTA',
        local: payload.area, categoria: 'Regra Eliminatória', descricao: `${regra.label}: ${regra.descricao}`, status: 'PENDENTE'
      });
    }
  }

  const valorFinal = desclassificado ? 0 : calcularBonus(notaGeral);
  await sb.from('bonificacoes').insert({ conferente_id: payload.conferenteId, auditoria_id: auditoria.id, valor: valorFinal, data: payload.data });

  alert(desclassificado
    ? `⚠️ TURNO DESCLASSIFICADO — Regra Eliminatória/Crítica violada. Bônus integral perdido (${fmtMoney(0)}).`
    : `Auditoria salva! Nota geral: ${notaGeral}%  •  Bonificação: ${fmtMoney(valorFinal)}`);
  state.route = 'dashboard';
  await loadAll();
}

async function atualizarStatusNC(ncId, status){
  await sb.from('nao_conformidades').update({status}).eq('id', ncId);
  await loadAll();
}
async function criarPlano(ncId, payload){
  await sb.from('planos_acao').insert({ nc_id: ncId, ...payload });
  await sb.from('nao_conformidades').update({status:'EM_ANDAMENTO'}).eq('id', ncId);
  await loadAll();
}
async function atualizarStatusPlano(planoId, status){
  await sb.from('planos_acao').update({status}).eq('id', planoId);
  if(status === 'CONCLUIDO'){
    const plano = state.planos.find(p=>p.id===planoId);
    if(plano) await sb.from('nao_conformidades').update({status:'CONCLUIDO'}).eq('id', plano.nc_id);
  }
  await loadAll();
}

/* ============================================================
   TELA: DASHBOARD EXECUTIVO
   ============================================================ */
function filteredAuditorias(){
  return state.auditorias.filter(a => {
    if(state.filters.de && a.data < state.filters.de) return false;
    if(state.filters.ate && a.data > state.filters.ate) return false;
    if(state.filters.turno !== 'Todos' && a.turno !== state.filters.turno) return false;
    if(state.filters.conferenteId !== 'Todos' && a.conferente_id !== state.filters.conferenteId) return false;
    if(state.filters.area !== 'Todas' && a.area !== state.filters.area) return false;
    return true;
  });
}

function DashboardScreen(){
  const auditorias = filteredAuditorias();
  const notaMedia = auditorias.length ? Math.round(auditorias.reduce((s,a)=>s+(a.nota_geral||0),0)/auditorias.length) : 0;
  const meta = 85;
  const statusGeral = notaMedia >= meta ? { label:'OK', cls:'bg-emerald-500 text-white' } : notaMedia >= meta-15 ? { label:'ATENÇÃO', cls:'bg-amber-500 text-slate-950' } : { label:'CRÍTICO', cls:'bg-rose-500 text-white' };

  const auditoriaIds = new Set(auditorias.map(a=>a.id));
  const bonifFiltradas = state.bonificacoes.filter(b => auditoriaIds.has(b.auditoria_id));
  const totalBonif = bonifFiltradas.reduce((s,b)=>s+Number(b.valor||0),0);

  const ncsFiltradas = state.ncs.filter(nc => auditoriaIds.has(nc.auditoria_id));
  const ncsPendentes = ncsFiltradas.filter(nc=>nc.status==='PENDENTE').length;
  const ncsAndamento = ncsFiltradas.filter(nc=>nc.status==='EM_ANDAMENTO').length;
  const ncsConcluidas = ncsFiltradas.filter(nc=>nc.status==='CONCLUIDO').length;

  // dias sem NC crítica
  const criticas = ncsFiltradas.filter(nc=>nc.criticidade==='ALTA').sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  const diasSemPerda = criticas.length ? Math.floor((Date.now() - new Date(criticas[0].created_at)) / 86400000) : (auditorias.length ? Math.floor((Date.now() - new Date(auditorias[0].created_at||auditorias[0].data)) / 86400000) : 0);

  // ranking conferentes
  const porConferente = {};
  auditorias.forEach(a=>{
    const c = state.conferentes.find(c=>c.id===a.conferente_id);
    if(!c) return;
    porConferente[c.id] = porConferente[c.id] || { nome:c.nome, notas:[], bonif:0, n:0 };
    porConferente[c.id].notas.push(a.nota_geral||0);
    porConferente[c.id].n++;
  });
  bonifFiltradas.forEach(b=>{ if(porConferente[b.conferente_id]) porConferente[b.conferente_id].bonif += Number(b.valor||0); });
  const rankingConferentes = Object.values(porConferente)
    .map(c=>({...c, media: Math.round(c.notas.reduce((s,n)=>s+n,0)/c.notas.length)}))
    .sort((a,b)=>b.media-a.media);

  // ranking locais
  const porLocal = {};
  ncsFiltradas.forEach(nc=>{ porLocal[nc.local] = (porLocal[nc.local]||0)+1; });
  const rankingLocais = Object.entries(porLocal).sort((a,b)=>b[1]-a[1]);

  // ranking turmas
  const porTurma = {};
  state.turmas.forEach(t => porTurma[t.id] = { nome:t.nome, bonif:0, n:0, ncs:0, notas:[] });
  auditorias.forEach(a=>{
    const c = state.conferentes.find(c=>c.id===a.conferente_id);
    if(!c || !c.turma_id || !porTurma[c.turma_id]) return;
    porTurma[c.turma_id].n++;
    porTurma[c.turma_id].notas.push(a.nota_geral||0);
  });
  bonifFiltradas.forEach(b=>{
    const c = state.conferentes.find(c=>c.id===b.conferente_id);
    if(c && c.turma_id && porTurma[c.turma_id]) porTurma[c.turma_id].bonif += Number(b.valor||0);
  });
  ncsFiltradas.forEach(nc=>{
    const a = state.auditorias.find(a=>a.id===nc.auditoria_id);
    const c = a && state.conferentes.find(c=>c.id===a.conferente_id);
    if(c && c.turma_id && porTurma[c.turma_id]) porTurma[c.turma_id].ncs++;
  });
  const rankingTurmas = Object.values(porTurma).map(t=>({...t, media: t.notas.length ? Math.round(t.notas.reduce((s,n)=>s+n,0)/t.notas.length) : null})).sort((a,b)=>(b.media||-1)-(a.media||-1));

  return `
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5 fade-in">
    ${FilterPanel()}

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${Card(`
        <div class="flex items-center justify-between mb-1"><span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Pontuação Geral (Média)</span><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${statusGeral.cls}">${statusGeral.label}</span></div>
        <div class="text-4xl font-display font-black text-white mt-2">${fmtPct(notaMedia)} <span class="text-sm font-medium text-slate-300">meta ${meta}%</span></div>
        <div class="w-full h-2 bg-slate-800 rounded-full mt-3 overflow-hidden"><div class="h-full bg-gradient-to-r from-indigo-500 to-cyan-400 rounded-full" style="width:${Math.min(100,notaMedia)}%"></div></div>
      `, 'col-span-2')}
      ${Card(`<div class="text-xs font-bold text-slate-300 uppercase tracking-wider">Bonificação Gerada</div><div class="text-3xl font-display font-black text-indigo-400 mt-2">${fmtMoney(totalBonif)}</div><div class="text-xs text-slate-300 mt-1">Ref. a ${auditorias.length} auditoria(s)</div>`)}
      ${Card(`<div class="text-xs font-bold text-slate-300 uppercase tracking-wider">Não Conformidades</div><div class="text-3xl font-display font-black text-amber-400 mt-2">${ncsFiltradas.length}</div><div class="text-xs text-slate-300 mt-1">${ncsPendentes} pendente(s)</div>`)}

function renderDashboardCharts(){
  if(!window.Chart) return;
  ['chartTendencia','chartCategoria','chartTurno'].forEach(id=>{
    const c = Chart.getChart(id); if(c) c.destroy();
  });
  const auditorias = filteredAuditorias().slice().sort((a,b)=> a.data.localeCompare(b.data));

  // Tendência
  const porDia = {};
  auditorias.forEach(a=>{ porDia[a.data] = porDia[a.data] || []; porDia[a.data].push(a.nota_geral||0); });
  const dias = Object.keys(porDia).sort();
  const mediasDia = dias.map(d => Math.round(porDia[d].reduce((s,n)=>s+n,0)/porDia[d].length));
  const elT = document.getElementById('chartTendencia');
  if(elT){
    new Chart(elT, { type:'line', data:{ labels: dias.map(fmtDate), datasets:[
      { label:'Meta (85%)', data: dias.map(()=>85), borderColor:'#f43f5e', borderDash:[6,6], pointRadius:0, tension:0 },
      { label:'Nota Geral', data: mediasDia, borderColor:'#6366f1', backgroundColor:'#6366f133', fill:true, tension:.35, pointBackgroundColor:'#6366f1' },
    ]}, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{min:50,max:100, grid:{color:'#1e293b'}, ticks:{color:'#94a3b8'}}, x:{grid:{display:false}, ticks:{color:'#94a3b8'}} }, plugins:{legend:{labels:{color:'#cbd5e1'}}} } });
  }

  // Categoria
  const elC = document.getElementById('chartCategoria');
  if(elC){
    const itensFiltrados = state.checklistItens.filter(i => auditorias.some(a=>a.id===i.auditoria_id));
    const pctPorCat = CATEGORIAS.map(cat=>{
      const itens = itensFiltrados.filter(i=>i.categoria===cat.nome);
      if(!itens.length) return 0;
      return Math.round(itens.filter(i=>i.conforme).length/itens.length*100);
    });
    new Chart(elC, { type:'bar', data:{ labels: CATEGORIAS.map(c=>`${c.nome} (${c.peso}%)`), datasets:[{ data: pctPorCat, backgroundColor:['#818cf8','#38bdf8','#2dd4bf','#fbbf24','#f472b6'], borderRadius:8 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{min:0,max:100,grid:{color:'#1e293b'},ticks:{color:'#94a3b8'}}, x:{grid:{display:false},ticks:{color:'#94a3b8', font:{size:10}}} } } });
  }

  // Turno donut
  const elTu = document.getElementById('chartTurno');
  if(elTu){
    const porTurno = {};
    auditorias.forEach(a=>{ porTurno[a.turno] = (porTurno[a.turno]||0)+1; });
    new Chart(elTu, { type:'doughnut', data:{ labels:Object.keys(porTurno), datasets:[{ data:Object.values(porTurno), backgroundColor:['#818cf8','#38bdf8','#2dd4bf','#fbbf24'], borderWidth:0 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:'#cbd5e1'}}} } });
  }
}

/* ============================================================
   CÂMERA AO VIVO — captura de evidência para itens Não Conforme
   ============================================================ */
async function abrirCamera(idx){
  state._camera = { itemIdx: idx, stream: null, erro: null, carregando: true, preview: null };
  render();
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Câmera não suportada neste navegador.');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: {ideal:1280}, height: {ideal:720} }, audio: false });
    state._camera.stream = stream;
    state._camera.carregando = false;
    render();
    const videoEl = document.getElementById('cameraVideo');
    if(videoEl) videoEl.srcObject = stream;
  }catch(err){
    console.warn('Erro câmera:', err);
    state._camera.carregando = false;
    if(err.name === 'NotAllowedError') state._camera.erro = 'Permissão da câmera negada. Permita o acesso ou use a opção abaixo para escolher uma foto do aparelho.';
    else if(err.name === 'NotFoundError') state._camera.erro = 'Nenhuma câmera encontrada. Use a opção abaixo para tirar foto pela câmera nativa do celular.';
    else state._camera.erro = 'Não foi possível iniciar a câmera diretamente. Use o botão abaixo para abrir a câmera do aparelho.';
    render();
  }
}
function pararCamera(){
  if(state._camera && state._camera.stream){ state._camera.stream.getTracks().forEach(t=>t.stop()); }
}
function fecharCamera(){
  pararCamera();
  state._camera = null;
  render();
}
function tirarFoto(){
  const video = document.getElementById('cameraVideo');
  if(!video) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
  ctx.fillText('EVIDÊNCIA BR3R - ' + new Date().toLocaleString('pt-BR'), 20, canvas.height - 20);
  state._camera.preview = canvas.toDataURL('image/jpeg', 0.85);
  render();
}

    state._novaAuditoria.itens[idx].fotos.push(reader.result);

  };
  reader.readAsDataURL(file);

function editarFaixaBonus(idx, campo, valor){
  const be = state._bonusEdit;
  const v = parseFloat(valor);
  if(campo === 'percentage'){
    be.table[idx].percentage = v;
    be.table[idx].value = be.max>0 ? Math.round((be.max*v/100)*100)/100 : be.table[idx].value;
  } else if(campo === 'value'){
    const tier = be.table[idx];
    if(tier.minScore===100 || idx===0){
      be.max = v;
      be.table.forEach(t=>{ t.value = Math.round((v*t.percentage/100)*100)/100; });
    } else {
      tier.value = v;
      tier.percentage = be.max>0 ? Math.round((v/be.max)*100) : tier.percentage;
    }
  } else {
    be.table[idx].minScore = v;
  }
  render();
}
function aplicarPresetBonus(max){
  const base = BONUS_TABLE.map(t=>({ minScore:t.minScore, percentage:t.percentage, value: Math.round((max*t.percentage/100)*100)/100 }));
  state._bonusEdit = { table: base, max };
  render();
}
async function salvarConfigBonus(){
  const be = state._bonusEdit;
  await sb.from('configuracoes').update({ bonus_table: be.table, max_bonus_value: be.max }).eq('id', 1);
  alert('Configurações de remuneração parametrizadas com sucesso.');
  await loadAll();
}
async function adicionarConferente(){
  const nome = $('#confNome').value.trim();
  const turma_id = $('#confTurma').value;
  if(!nome) return;
  await sb.from('conferentes').insert({ nome, turma_id, ativo: true });
  await loadAll();
}

    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
    : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  return `<button onclick="toggleTheme()" title="${isLight?'Mudar para tema escuro':'Mudar para tema claro'}" class="${compact?'h-10 w-10':'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl'} flex items-center justify-center border border-slate-800 text-slate-300 hover:bg-slate-800 transition-colors shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
    ${compact?'':`<span class="font-semibold text-sm">${isLight?'Tema Claro':'Tema Escuro'}</span>`}
  </button>`;
}

function render(){
  const root = $('#root');
  if(!state.session){
    document.documentElement.classList.remove('light'); // login sempre no tema escuro original
    root.innerHTML = LoginScreen();
    $('#loginForm').addEventListener('submit', (e)=>{ e.preventDefault(); doLogin($('#loginEmail').value, $('#loginPassword').value); });
    return;
  }
  document.documentElement.classList.toggle('light', state.theme === 'light');
  let body = '';
  if(state.loading){
    body = `<div class="flex items-center justify-center py-24"><div class="h-8 w-8 border-2 border-t-indigo-500 border-slate-700 rounded-full animate-spin"></div></div>`;
  } else {
    body = {
      'dashboard': DashboardScreen,
      'nova-auditoria': NovaAuditoriaScreen,
      'planos-acao': PlanosAcaoScreen,
      'historico': HistoricoScreen,
      'configuracoes': ConfiguracoesScreen,
    }[state.route]?.() || DashboardScreen();
  }
  root.innerHTML = `${Sidebar()}<div class="lg:pl-64">${Header()}${body}</div>`;
  if(state.route === 'dashboard' && !state.loading) setTimeout(renderDashboardCharts, 0);
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
async function init(){
  window.__deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__deferredInstallPrompt = e;
    state._canInstall = true;
    render();
  });
  window.addEventListener('appinstalled', () => { state._canInstall = false; render(); });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  if(sb){
    const { data } = await sb.auth.getSession();
    if(data.session){
      state.session = data.session;
      const { data: perfil } = await sb.from('perfis').select('*').eq('id', data.session.user.id).single();
      state.perfil = perfil;
      state.route = 'dashboard';
      await loadAll();
      return;
    }
  }
  render();
}
init();
</script>
</body>
</html>
